<!doctype html>
<html lang="en" class="light">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
      <title>Tour Vibes | Travel journals on a map</title>
      <meta
         name="description"
         content="Write the trip, pin it to the map, share the story. Tour Vibes is a travel journal where every story has a photo, a place on a world map, likes and comments."
      />
      <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
      <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
      <meta name="theme-color" content="#f8fafd" media="(prefers-color-scheme: light)" />
      <meta name="theme-color" content="#0a0c0f" media="(prefers-color-scheme: dark)" />
      <meta name="color-scheme" content="light dark" />

      <meta property="og:type" content="website" />
      <meta property="og:site_name" content="Tour Vibes" />
      <meta property="og:title" content="Tour Vibes | Travel journals on a map" />
      <meta
         property="og:description"
         content="Write the trip, pin it to the map, share the story. Browse travel journals from around the world on one map."
      />
      <meta property="og:url" content="https://sagargupta.online/tour-vibes/" />
      <meta property="og:locale" content="en_US" />
      <meta property="og:image" content="https://sagargupta.online/tour-vibes/og-image.jpeg" />
      <meta property="og:image:width" content="1200" />
      <meta property="og:image:height" content="630" />
      <meta
         property="og:image:alt"
         content="Tour Vibes landing page: Write the trip. Pin it to the map."
      />
      <meta name="twitter:card" content="summary_large_image" />
      <meta name="twitter:image" content="https://sagargupta.online/tour-vibes/og-image.jpeg" />
      <meta name="twitter:title" content="Tour Vibes | Travel journals on a map" />
      <meta
         name="twitter:description"
         content="Write the trip, pin it to the map, share the story. Browse travel journals from around the world on one map."
      />

      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-title" content="Tour Vibes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="default" />
      <meta name="format-detection" content="telephone=no" />

      <!-- Apply the saved theme before first paint, so dark mode never flashes white -->
      <script>
         (() => {
            try {
               const saved = localStorage.getItem('tour-vibes:theme') || 'system';
               const dark =
                  saved === 'dark' ||
                  (saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
               document.documentElement.classList.replace('light', dark ? 'dark' : 'light');
            } catch {
               // Storage blocked: the React theme provider applies the theme on mount
            }
         })();
      </script>
   </head>
   <body>
      <div id="root"></div>
      <script type="module" src="/src/main.jsx"></script>
   </body>
</html>
