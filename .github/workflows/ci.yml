name: CI
on:
   push:
      branches: [main]
   pull_request:
permissions:
   contents: read
jobs:
   client:
      uses: Sagargupta16/shared-workflows/.github/workflows/node-ci.yml@main
      with:
         working-directory: client
         run-tests: false
   server:
      uses: Sagargupta16/shared-workflows/.github/workflows/node-ci.yml@main
      with:
         working-directory: server
         # node:test + supertest against an in-memory MongoDB (mongodb-memory-server)
         run-tests: true
   format:
      name: Prettier
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v6
         - uses: actions/setup-node@v6
           with:
              node-version-file: .nvmrc
              cache: npm
         - run: npm ci --ignore-scripts
         - run: npm run format:check
   docker:
      name: Docker compose smoke test
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v6
         - run: docker compose up --build --detach --wait
         - run: docker compose run --rm api npm run seed
         - name: Client serves the app, demo login returns a token
           run: |
              curl -fsS --retry 10 --retry-connrefused --retry-delay 2 http://localhost:3000/journals | grep -q 'id="root"'
              curl -fsS --retry 10 --retry-connrefused --retry-delay 2 -X POST http://localhost:8000/auth/demo | grep -q '"token"'
         - if: failure()
           run: docker compose logs
