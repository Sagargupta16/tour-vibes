name: Pages
# Live demo at https://sagargupta.online/tour-vibes/: the client built with
# `npm run build:demo`, an in-browser mock API seeded from server/seed, no server
on:
   push:
      branches: [main]
      paths:
         - client/**
         - server/seed/**
         - .github/workflows/pages.yml
   workflow_dispatch:
permissions: {}
concurrency:
   group: pages
   # Let a deploy that has started finish; a newer push queues behind it
   cancel-in-progress: false
jobs:
   build:
      name: Build the static demo
      runs-on: ubuntu-latest
      permissions:
         contents: read
      defaults:
         run:
            working-directory: client
      steps:
         - uses: actions/checkout@v7
           with:
              persist-credentials: false
         - uses: actions/setup-node@v7
           with:
              node-version-file: .nvmrc
              cache: npm
              cache-dependency-path: client/package-lock.json
         - run: npm ci --ignore-scripts
         - run: npm run build:demo
         - uses: actions/upload-pages-artifact@v5
           with:
              path: client/dist
   deploy:
      name: Deploy to GitHub Pages
      needs: build
      runs-on: ubuntu-latest
      permissions:
         pages: write
         id-token: write
      environment:
         name: github-pages
         url: ${{ steps.deployment.outputs.page_url }}
      steps:
         - id: deployment
           uses: actions/deploy-pages@v5
